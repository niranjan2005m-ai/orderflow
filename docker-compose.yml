services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-orderflow}
    ports:
      - "5433:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d ${POSTGRES_DB:-orderflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: orderflow-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: orderflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [
      "/opt/kafka/bin/kafka-topics.sh",
      "--bootstrap-server", "kafka:9092",
      "--create",
      "--if-not-exists",
      "--topic", "order.created",
      "--partitions", "1",
      "--replication-factor", "1"
    ]

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: orderflow-inventory-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
      INVENTORY_SERVICE_PORT: 50052
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: orderflow-order-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
      INVENTORY_SERVICE_ADDR: inventory-service:50052
      ORDER_SERVICE_PORT: 50051
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: order-service
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: orderflow-notification-service
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: notification-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: orderflow-gateway
    environment:
      GATEWAY_PORT: 4000
      ORDER_SERVICE_ADDR: order-service:50051
      INVENTORY_SERVICE_ADDR: inventory-service:50052
    ports:
      - "4000:4000"
    depends_on:
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started

volumes:
  postgres_data:
