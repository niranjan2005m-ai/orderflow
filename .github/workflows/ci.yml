name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            inventory-service/package-lock.json
            order-service/package-lock.json
            notification-service/package-lock.json
            gateway/package-lock.json

      # 1. inventory-service
      - name: Install dependencies (inventory-service)
        working-directory: inventory-service
        run: npm ci

      - name: Typecheck (inventory-service)
        working-directory: inventory-service
        run: npx tsc --noEmit

      - name: Test (inventory-service)
        working-directory: inventory-service
        run: npm test

      # 2. order-service
      - name: Install dependencies (order-service)
        working-directory: order-service
        run: npm ci

      - name: Typecheck (order-service)
        working-directory: order-service
        run: npx tsc --noEmit

      - name: Test (order-service)
        working-directory: order-service
        run: npm test

      # 3. notification-service
      - name: Install dependencies (notification-service)
        working-directory: notification-service
        run: npm ci

      - name: Typecheck (notification-service)
        working-directory: notification-service
        run: npx tsc --noEmit

      # 4. gateway
      - name: Install dependencies (gateway)
        working-directory: gateway
        run: npm ci

      - name: Typecheck (gateway)
        working-directory: gateway
        run: npx tsc --noEmit

      # 5. docker compose build
      - name: Build Docker images
        run: docker compose build
