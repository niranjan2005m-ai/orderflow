syntax = "proto3";

package inventory;

// The InventoryService manages product catalogue and stock levels.
// Order-service calls ReserveStock before inserting an order.
// Order-service calls ReleaseStock when an order is cancelled.
service InventoryService {
  rpc GetProduct    (GetProductRequest)    returns (ProductResponse);
  rpc ListProducts  (ListProductsRequest)  returns (ListProductsResponse);
  rpc ReserveStock  (ReserveStockRequest)  returns (ReserveStockResponse);
  rpc ReleaseStock  (ReleaseStockRequest)  returns (ReleaseStockResponse);
}

message GetProductRequest {
  int32 id = 1;
}

message ListProductsRequest {
  // intentionally empty — returns all products
}

message ReserveStockRequest {
  int32 product_id = 1;
  int32 quantity   = 2;
}

message ReleaseStockRequest {
  int32 product_id = 1;
  int32 quantity   = 2;
}

message ProductResponse {
  int32  id    = 1;
  string name  = 2;
  double price = 3;
  int32  stock = 4;
}

message ListProductsResponse {
  repeated ProductResponse products = 1;
}

// Returns the reserved unit price so order-service can store it
message ReserveStockResponse {
  double price = 1;
}

message ReleaseStockResponse {
  bool success = 1;
}
